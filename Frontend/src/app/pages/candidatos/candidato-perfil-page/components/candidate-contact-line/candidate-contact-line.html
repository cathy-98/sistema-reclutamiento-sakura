<section class="contact-block" aria-label="Datos de contacto prioritarios">
  <div class="contact-inline" *ngIf="!editandoInformacion; else contactEditForm">
    <span>
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="var(--color-sakura)" stroke-width="2" aria-hidden="true">
        <path d="M4 6h16v12H4z" />
        <path d="m4 7 8 6 8-6" />
      </svg>
      {{ candidato.correo }}
    </span>
    <span>
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="var(--color-sakura)" stroke-width="2" aria-hidden="true">
        <path d="M6 5c2 6 7 11 13 13l2-4-4-2-2 2c-2-1-4-3-5-5l2-2-2-4z" />
      </svg>
      {{ candidato.telefono || 'Sin teléfono' }}
    </span>
    <a *ngIf="candidato.urlPerfil" [href]="candidato.urlPerfil" target="_blank" rel="noreferrer">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="var(--color-sakura)" stroke-width="2" aria-hidden="true">
        <path d="M6 9v10" />
        <path d="M6 5v.2" />
        <path d="M11 19v-6a4 4 0 0 1 8 0v6" />
        <path d="M11 9v10" />
      </svg>
      {{ candidato.urlPerfil }}
    </a>
    <app-icon-button
      icon="edit"
      label="Editar correo y teléfono"
      [disabled]="saving"
      (pressed)="iniciarEdicion()"
    ></app-icon-button>
  </div>

  <ng-template #contactEditForm>
    <form class="contact-edit-form" (ngSubmit)="guardarInformacion()">
      <label>
        Correo
        <input
          name="correoContacto"
          type="email"
          [(ngModel)]="correoEdicion"
          placeholder="correo@dominio.cl"
        />
      </label>
      <label>
        Teléfono
        <input
          name="telefonoContacto"
          type="tel"
          [(ngModel)]="telefonoEdicion"
          placeholder="+56 9 1234 5678"
        />
      </label>
      <div class="contact-edit-actions">
        <button type="button" class="secondary-action" [disabled]="saving" (click)="cancelarEdicion()">
          Cancelar
        </button>
        <button type="submit" class="primary-action" [disabled]="saving">
          {{ saving ? 'Guardando...' : 'Guardar' }}
        </button>
      </div>
    </form>
  </ng-template>

  <p class="contact-error" *ngIf="errorLocal || error">{{ errorLocal || error }}</p>
</section>

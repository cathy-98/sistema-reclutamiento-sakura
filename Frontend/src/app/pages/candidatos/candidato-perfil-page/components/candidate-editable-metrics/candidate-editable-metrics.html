<section class="hero-summary" aria-labelledby="candidate-metrics-title">
  <h2 id="candidate-metrics-title" class="sr-only">Datos clave del candidato</h2>

  <article class="metric-item" aria-labelledby="candidate-match-title">
    <h3 id="candidate-match-title" class="metric-title">Match</h3>
    <app-match-score [value]="candidato.match + '%'" [scoreClass]="matchClass"></app-match-score>
  </article>

  <article class="metric-item" aria-labelledby="candidate-income-title">
    <header class="metric-header">
      <h3 id="candidate-income-title" class="metric-title">Renta esperada</h3>
      <app-icon-button
        *ngIf="!editandoRenta"
        icon="edit"
        label="Editar renta esperada"
        (pressed)="iniciarEdicionRenta()"
      ></app-icon-button>
    </header>

    <strong *ngIf="!editandoRenta" class="metric-value">{{ rentaFormateada }}</strong>

    <ng-container *ngIf="editandoRenta">
      <input
        id="candidate-income-input"
        type="number"
        min="0"
        step="10000"
        [(ngModel)]="rentaEdicion"
      />
      <small>{{ rentaEdicionFormateada }}</small>
      <small *ngIf="errorRenta" class="metric-error">{{ errorRenta }}</small>

      <div class="edit-actions">
        <button type="button" class="secondary-action" (click)="cancelarEdicionRenta()">
          Cancelar
        </button>
        <button type="button" class="primary-action" (click)="guardarRenta()">
          Guardar
        </button>
      </div>
    </ng-container>
  </article>

  <article class="metric-item" aria-labelledby="candidate-availability-title">
    <header class="metric-header">
      <h3 id="candidate-availability-title" class="metric-title">Disponibilidad</h3>
      <app-icon-button
        *ngIf="!editandoDisponibilidad"
        icon="edit"
        label="Editar disponibilidad"
        (pressed)="iniciarEdicionDisponibilidad()"
      ></app-icon-button>
    </header>

    <strong *ngIf="!editandoDisponibilidad" class="metric-value">{{ candidato.disponibilidad }}</strong>

    <select
      *ngIf="editandoDisponibilidad"
      id="candidate-availability-select"
      [(ngModel)]="disponibilidadEdicion"
    >
      <option value="">Seleccionar disponibilidad</option>
      <option *ngFor="let disponibilidad of disponibilidades">{{ disponibilidad }}</option>
    </select>
    <small *ngIf="errorDisponibilidad" class="metric-error">{{ errorDisponibilidad }}</small>

    <ng-container *ngIf="editandoDisponibilidad">
      <div class="edit-actions">
        <button type="button" class="secondary-action" (click)="cancelarEdicionDisponibilidad()">
          Cancelar
        </button>
        <button type="button" class="primary-action" (click)="guardarDisponibilidad()">
          Guardar
        </button>
      </div>
    </ng-container>
  </article>
</section>

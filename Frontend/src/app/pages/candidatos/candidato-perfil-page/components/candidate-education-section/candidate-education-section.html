<article class="content-panel resume-panel">
  <h2>Estudios y Cursos</h2>
  <ng-container *ngIf="tieneContenido; else sinFormacion">
    <section class="education-subsection" *ngIf="tieneEstudios">
      <h3 class="education-subtitle">Formación académica</h3>
      <div class="education-list">
        <article *ngFor="let estudio of estudios">
          <h4>{{ estudio.titulo }}</h4>
          <p>{{ estudio.institucion }}</p>
          <div class="education-meta">
            <small>{{ estudio.fecha }}</small>
          </div>
        </article>
      </div>
    </section>

    <section class="education-subsection" *ngIf="tieneCursos">
      <h3 class="education-subtitle">Cursos y certificaciones</h3>
      <div class="education-list">
        <article *ngFor="let curso of cursos">
          <h4>{{ curso.nombre }}</h4>
          <div class="education-meta" *ngIf="curso.metadata.length || curso.certificado">
            <small *ngIf="curso.metadata.length">{{ curso.metadata.join(' · ') }}</small>
            <span *ngIf="curso.certificado">Certificado</span>
          </div>
        </article>
      </div>
    </section>
  </ng-container>

  <ng-template #sinFormacion>
    <p class="education-empty">No hay estudios ni cursos registrados.</p>
  </ng-template>
</article>

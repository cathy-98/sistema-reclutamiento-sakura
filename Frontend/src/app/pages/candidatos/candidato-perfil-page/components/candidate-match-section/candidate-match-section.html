<section class="match-panel" aria-labelledby="match-summary-title">
  <app-match-score [value]="matchText" [scoreClass]="matchClass"></app-match-score>
  <div>
    <h2 id="match-summary-title">Match de la postulación</h2>
    <p *ngIf="!tieneInformacionMatch">No hay información de match disponible para esta postulación.</p>
  </div>
</section>

<section
  *ngIf="habilidades.length > 0"
  class="content-panel match-detail-panel"
  aria-labelledby="match-skills-title"
>
  <h2 id="match-skills-title">Habilidades técnicas</h2>
  <div class="match-table-scroll">
    <table class="match-table">
      <thead>
        <tr>
          <th scope="col">Tecnología candidato</th>
          <th scope="col">Nivel candidato</th>
          <th scope="col">Años candidato</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let item of habilidades">
          <td>{{ item[0] }}</td>
          <td>{{ item[1] }}</td>
          <td>{{ item[2] }}</td>
        </tr>
      </tbody>
    </table>
  </div>
</section>

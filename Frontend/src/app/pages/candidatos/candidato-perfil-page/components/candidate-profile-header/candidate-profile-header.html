<div class="hero-top">
  <button class="back-link" type="button" (click)="back.emit()">
    <span aria-hidden="true">←</span>
    Volver al listado
  </button>
</div>

<div class="candidate-brief">
  <div class="candidate-main">
    <div class="name-row">
      <h1>{{ candidato.nombre }}</h1>
    </div>
    <p class="applied-role">
      <span>Postulado a</span>
      <strong>{{ candidato.cargo }}</strong>
    </p>
    <p class="professional-summary">{{ candidato.resumenProfesional }}</p>
    <app-candidate-contact-line
      [candidato]="candidato"
      [saving]="contactSaving"
      [error]="contactError"
      (saveContact)="saveContact.emit($event)"
    ></app-candidate-contact-line>

    <div class="candidate-primary-actions" aria-label="Acciones principales del candidato">
      <app-button (pressed)="scheduleInterview.emit()">Agendar entrevista</app-button>
    </div>
  </div>

  <div class="candidate-controls">
    <label class="request-selector" *ngIf="postulaciones.length > 1; else singleRequest">
      Solicitud
      <select
        [ngModel]="postulacionSeleccionadaId"
        (ngModelChange)="seleccionarPostulacion($event)"
      >
        <option
          *ngFor="let postulacion of postulaciones"
          [ngValue]="postulacion[0]"
        >
          {{ postulacion[0] }} · {{ postulacion[2] }}
        </option>
      </select>
    </label>

    <ng-template #singleRequest>
      <span class="request-badge">{{ candidato.idSolicitud || 'Sin solicitud' }}</span>
    </ng-template>

    <label>
      Estado postulación
      <select
        [(ngModel)]="candidato.estado"
        [disabled]="!canSavePostulationState"
      >
        <option *ngFor="let estado of estadosPostulacionDisponibles">{{ estado }}</option>
      </select>
    </label>
    <app-button
      type="button"
      size="sm"
      variant="secondary"
      [disabled]="!canSavePostulationState"
      (pressed)="savePostulationState.emit()"
    >
      Guardar estado
    </app-button>
  </div>
</div>

<app-candidate-editable-metrics
  [candidato]="candidato"
  [matchClass]="matchClass"
  [matchText]="matchText"
  (rentaSave)="saveRent.emit($event)"
  (disponibilidadSave)="saveAvailability.emit($event)"
></app-candidate-editable-metrics>
<app-candidate-details-disclosure [candidato]="candidato"></app-candidate-details-disclosure>

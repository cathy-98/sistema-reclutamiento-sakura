<app-page-layout>
  <app-page-header
    title="Listado de candidatos"
    subtitle="Gestión de candidatos"
  >
    <div pageHeaderActions>
      <app-button type="button">Realizar match</app-button>
    </div>
  </app-page-header>

  <app-alert-region [alerta]="alerta" (cerrar)="cerrarAlerta()"></app-alert-region>

  <app-file-dropzone
    title="Carga CVs de candidatos"
    description="Arrastra uno o más CVs para dejarlos listos antes de procesarlos."
    buttonText="Seleccionar CVs"
    [allowedExtensions]="['pdf', 'doc', 'docx']"
    [maxFileSizeMb]="10"
    (filesChange)="actualizarArchivosCv($event)"
  ></app-file-dropzone>

  <app-filter-panel
    description="Usa uno o más campos para encontrar candidatos."
    quickSearchPlaceholder="Ej. Macarena Lopez, Req-021 o Frontend"
    [(quickSearch)]="busquedaRapida"
    (search)="buscar()"
    (clear)="limpiarFiltros()"
  >
    <label>
      ID solicitud
      <input [(ngModel)]="filtros.idSolicitud" type="text" placeholder="Ej. Req-021" />
    </label>
    <label>
      Cargo postulado
      <input [(ngModel)]="filtros.cargo" type="text" placeholder="Ej. Frontend Angular" />
    </label>
    <label>
      Nombre completo
      <input [(ngModel)]="filtros.nombre" type="text" placeholder="Ej. Macarena Lopez" />
    </label>
    <label>
      Correo electrónico
      <input [(ngModel)]="filtros.correo" type="email" placeholder="Ej. macarena.lopez@mail.com" />
    </label>
    <label>
      Número de teléfono
      <input [(ngModel)]="filtros.telefono" type="text" placeholder="Ej. +56 9 5634 8547" />
    </label>
    <label>
      Estado del candidato
      <select [(ngModel)]="filtros.estado">
        <option *ngFor="let estado of estados" [ngValue]="estado">{{ estado }}</option>
      </select>
    </label>
    <label>
      Disponibilidad
      <input [(ngModel)]="filtros.disponibilidad" type="text" placeholder="Ej. Inmediata" />
    </label>
    <label>
      Pretensión de renta
      <input [(ngModel)]="filtros.renta" type="number" min="0" placeholder="Ej. 900000" />
    </label>
    <label>
      Match
      <input [(ngModel)]="filtros.match" type="number" min="0" max="100" placeholder="Ej. 75" />
    </label>
    <label>
      Nivel
      <select [(ngModel)]="filtros.nivel">
        <option value="">Todos</option>
        <option *ngFor="let nivel of niveles" [ngValue]="nivel">{{ nivel }}</option>
      </select>
    </label>
    <label>
      Años de experiencia
      <input [(ngModel)]="filtros.experiencia" type="number" min="0" placeholder="Ej. 3" />
    </label>
  </app-filter-panel>

  <app-action-bar
    [message]="mensajeAccionesMasivas"
    aria-label="Acciones masivas"
    *ngIf="!cargando && !errorCarga && candidatosFiltrados.length > 0"
  >
    <button type="button" [disabled]="seleccionados.size === 0">
      <span aria-hidden="true">✓</span>
      Enviar correo
    </button>
    <button type="button" [disabled]="seleccionados.size === 0" (click)="abrirAgendaMasiva()">
      <span aria-hidden="true">✦</span>
      Agendar entrevistas
    </button>
    <button type="button" [disabled]="seleccionados.size === 0" (click)="prepararTestMasivo()">
      <span aria-hidden="true">+</span>
      Enviar test
    </button>
  </app-action-bar>

  <app-data-table
    title="Listado de candidatos"
    [columns]="columnas"
    [rows]="candidatosPaginados"
    [total]="candidatosFiltrados.length"
    [page]="paginaActual"
    [pageSize]="registrosPorPagina"
    [loading]="cargando"
    [errorMessage]="errorCarga"
    loadingMessage="Cargando candidatos..."
    [rowId]="obtenerIdCandidato"
    [actions]="acciones"
    [compactActions]="true"
    [selectedIds]="seleccionados"
    emptyTitle="No hay candidatos para mostrar"
    emptyMessage="Ajusta los filtros o limpia la búsqueda para volver al listado completo."
    (selectedIdsChange)="seleccionados = $event"
    (pageChange)="cambiarPagina($event)"
    (pageSizeChange)="cambiarRegistrosPorPagina($event)"
    (actionClick)="manejarAccionTabla($event)"
    (clear)="limpiarFiltros()"
    (retry)="cargarCandidatos()"
  ></app-data-table>

  <app-entrevista-form-modal
    *ngIf="mostrarModalAgenda"
    [candidatos]="candidatosAgenda"
    (candidatosChange)="actualizarCandidatosAgenda($event)"
    (cerrar)="cerrarAgendaEntrevista()"
    (guardar)="guardarAgendaEntrevista($event)"
  ></app-entrevista-form-modal>

</app-page-layout>

<app-confirm-dialog
  *ngIf="mostrarConfirmacionDesactivacion"
  titulo="Desactivar candidato"
  mensaje="Esta acción cambiará el estado del candidato a Desactivado."
  [detalle]="'Candidato seleccionado: ' + (candidatoSeleccionadoDesactivacion?.nombre || '')"
  textoCancelar="Volver"
  textoConfirmar="Confirmar desactivación"
  variante="danger"
  (cancelar)="cerrarConfirmacionDesactivacion()"
  (confirmar)="confirmarDesactivacionCandidato()"
></app-confirm-dialog>

<app-page-layout>

  <!--
    Integración M3 - Candidatos y Postulaciones

    Esta pantalla administra candidatos como personas independientes
    de sus postulaciones.

    Un candidato puede participar en múltiples solicitudes.
    Los datos de proceso como código SOL-XXX, match, estado,
    renta y fecha pertenecen a la postulación.
  -->
  <app-page-header
    title="Listado de candidatos"
    subtitle="Gestión de candidatos y postulaciones"
  >
    <div pageHeaderActions>
      <app-button type="button">
        Realizar match
      </app-button>
    </div>
  </app-page-header>


  <app-alert-region
    [alerta]="alerta"
    (cerrar)="cerrarAlerta()"
  ></app-alert-region>


  <!--
    Integración M3

    La importación de CV pertenece al flujo administrativo
    de candidatos.

    Backend soporta importación mediante multipart/form-data.
  -->
  <app-file-dropzone
    title="Carga CVs de candidatos"
    description="Arrastra uno o más CVs para dejarlos listos antes de procesarlos."
    buttonText="Seleccionar CVs"
    [allowedExtensions]="['pdf', 'docx', 'txt']"
    [maxFileSizeMb]="10"
    (filesChange)="actualizarArchivosCv($event)"
  ></app-file-dropzone>

  <div class="cv-upload-actions" *ngIf="archivosCv.length > 0">
    <span>{{ archivosCv.length }} archivo(s) listo(s) para procesar.</span>
    <app-button
      type="button"
      [disabled]="importandoCvs"
      (pressed)="procesarArchivosCv()"
    >
      {{ importandoCvs ? 'Procesando...' : 'Procesar CVs' }}
    </app-button>
  </div>


  <!--
    Decisión UX/UI M3

    La búsqueda rápida es la acción principal del listado.
    Permite localizar candidatos utilizando:
    - nombre
    - correo
    - código de solicitud SOL-XXX
    - cargo

    Los filtros específicos se mantienen para búsquedas
    de reclutamiento más precisas.
  -->
  <app-filter-panel
    description="Busca rápidamente o combina filtros para encontrar candidatos dentro de sus procesos de selección."
    quickSearchPlaceholder="Buscar por nombre, correo, SOL-000021 o cargo"

  [(quickSearch)]="busquedaRapida"

  [collapsible]="true"
  [filtersExpanded]="false"

  (search)="buscar()"
  (clear)="limpiarFiltros()"
>

    <!--
      Integración M3

      Busca cualquiera de las solicitudes asociadas al candidato.
      No corresponde a cand_id.
    -->
    <label>
      Código de solicitud

      <input
        [(ngModel)]="filtros.idSolicitud"
        type="text"
        placeholder="Ej. SOL-000021"
      />
    </label>


    <label>
      Estado de postulación

      <select
        [(ngModel)]="filtros.estado"
      >
        <option
          *ngFor="let estado of estados"
          [ngValue]="estado"
        >
          {{ estado }}
        </option>
      </select>
    </label>


    <label>
      Cargo postulado

      <input
        [(ngModel)]="filtros.cargo"
        type="text"
        placeholder="Ej. Frontend Angular"
      />
    </label>


    <!--
      Decisión UX/UI M3

      El filtro funciona como match mínimo.
      Ejemplo: ingresar 75 muestra candidatos con match >= 75%.
    -->
    <label>
      Match mínimo (%)

      <input
        [(ngModel)]="filtros.match"
        type="number"
        min="0"
        max="100"
        placeholder="Ej. 75"
      />
    </label>


    <label>
      Disponibilidad

      <select
        *ngIf="disponibilidades.length > 0; else disponibilidadTexto"
        [(ngModel)]="filtros.disponibilidad"
      >
        <option value="">
          Todas
        </option>

        <option
          *ngFor="let disponibilidad of disponibilidades"
          [ngValue]="disponibilidad"
        >
          {{ disponibilidad }}
        </option>
      </select>


      <ng-template #disponibilidadTexto>
        <input
          [(ngModel)]="filtros.disponibilidad"
          type="text"
          placeholder="Ej. Inmediata"
        />
      </ng-template>
    </label>


    <!--
      Decisión UX/UI M3

      El filtro de renta representa un monto máximo.
      La lógica actual del listado utiliza:
      candidato.renta <= filtros.renta.
    -->
    <label>
      Renta máxima

      <input
        [(ngModel)]="filtros.renta"
        type="number"
        min="0"
        placeholder="Ej. 900000"
      />
    </label>


    <label>
      Nivel

      <select
        [(ngModel)]="filtros.nivel"
      >
        <option value="">
          Todos
        </option>

        <option
          *ngFor="let nivel of niveles"
          [ngValue]="nivel"
        >
          {{ nivel }}
        </option>
      </select>
    </label>


    <label>
      Experiencia mínima

      <input
        [(ngModel)]="filtros.experiencia"
        type="number"
        min="0"
        placeholder="Ej. 3 años"
      />
    </label>


    <!--
      Filtros secundarios de identificación.

      Se conservan para búsquedas específicas aunque
      nombre y correo también participan de la búsqueda rápida.
    -->
    <label>
      Nombre completo

      <input
        [(ngModel)]="filtros.nombre"
        type="text"
        placeholder="Ej. Macarena Lopez"
      />
    </label>


    <label>
      Correo electrónico

      <input
        [(ngModel)]="filtros.correo"
        type="email"
        placeholder="Ej. macarena.lopez@mail.com"
      />
    </label>


    <label>
      Número de teléfono

      <input
        [(ngModel)]="filtros.telefono"
        type="text"
        placeholder="Ej. +56 9 5634 8547"
      />
    </label>

  </app-filter-panel>


  <!--
    Integración M3

    Las acciones masivas se realizan sobre candidatos seleccionados
    mediante cand_id.

    No se utiliza el código de solicitud como identificador
    de selección porque un candidato puede tener varias postulaciones.
  -->
  <app-action-bar
    *ngIf="
      !cargando &&
      !errorCarga &&
      candidatosFiltrados.length > 0
    "
    [message]="mensajeAccionesMasivas"
    aria-label="Acciones masivas"
  >

    <button
      type="button"
      [disabled]="seleccionados.size === 0"
    >
      <span aria-hidden="true">
        ✓
      </span>

      Enviar correo
    </button>


    <button
      type="button"
      [disabled]="seleccionados.size === 0"
      (click)="abrirAgendaMasiva()"
    >
      <span aria-hidden="true">
        ✦
      </span>

      Agendar entrevistas
    </button>


    <button
      type="button"
      [disabled]="seleccionados.size === 0"
      (click)="prepararTestMasivo()"
    >
      <span aria-hidden="true">
        +
      </span>

      Enviar test
    </button>

  </app-action-bar>


  <!--
    Integración M3

    La primera columna "Solicitudes" puede representar múltiples
    postulaciones para un mismo candidato.

    Visualización definida en candidatos-list.ts:

    SOL-000021
    SOL-000021 · SOL-000034
    SOL-000021 · SOL-000034 · +2

    Match, cargo, estado, renta y fecha muestran actualmente
    la postulación más reciente como resumen de la fila.

    El detalle completo de cada proceso se gestiona
    desde el perfil del candidato.
  -->
  <app-data-table
    title="Listado de candidatos"
    [columns]="columnas"
    [rows]="candidatosPaginados"
    [total]="candidatosFiltrados.length"
    [page]="paginaActual"
    [pageSize]="registrosPorPagina"
    [loading]="cargando"
    [errorMessage]="errorCarga"
    loadingMessage="Cargando candidatos..."
    [rowId]="obtenerIdCandidato"
    [actions]="acciones"
    [compactActions]="true"
    [selectedIds]="seleccionados"
    emptyTitle="No hay candidatos para mostrar"
    emptyMessage="Ajusta los filtros o limpia la búsqueda para volver al listado completo."
    (selectedIdsChange)="seleccionados = $event"
    (pageChange)="cambiarPagina($event)"
    (pageSizeChange)="cambiarRegistrosPorPagina($event)"
    (actionClick)="manejarAccionTabla($event)"
    (clear)="limpiarFiltros()"
    (retry)="cargarCandidatos()"
  ></app-data-table>


  <!--
    Integración M3 -> M5

    El candidato puede iniciar el flujo de agenda desde M3,
    pero la creación y gestión de entrevistas pertenece a M5.

    Cuando existan varias postulaciones, el siguiente ajuste
    del modal deberá permitir identificar explícitamente
    sobre cuál proceso se agenda la entrevista.
  -->
  <app-entrevista-form-modal
    *ngIf="mostrarModalAgenda"
    [candidatos]="candidatosAgenda"
    (candidatosChange)="actualizarCandidatosAgenda($event)"
    (cerrar)="cerrarAgendaEntrevista()"
    (guardar)="guardarAgendaEntrevista($event)"
  ></app-entrevista-form-modal>


</app-page-layout>


<!--
  Integración M3

  La desactivación afecta la cuenta del candidato,
  no el estado de una postulación.

  Los cambios de estado de postulación se gestionarán
  posteriormente desde el perfil/proceso seleccionado.
-->
<app-confirm-dialog
  *ngIf="mostrarConfirmacionDesactivacion"
  titulo="Desactivar cuenta"
  mensaje="Esta acción cambiará el estado de cuenta del candidato a Inactivo."
  [detalle]="
    'Candidato seleccionado: ' +
    (candidatoSeleccionadoDesactivacion?.nombre || '')
  "
  textoCancelar="Volver"
  textoConfirmar="Confirmar inactivación"
  variante="danger"
  (cancelar)="cerrarConfirmacionDesactivacion()"
  (confirmar)="confirmarDesactivacionCandidato()"
></app-confirm-dialog>

<app-modal
  titulo="Enviar cuestionario"
  [subtitulo]="cantidadPreguntas + ' preguntas seleccionadas - ' + duracion"
  ancho="md"
  (cerrar)="cerrar.emit()"
>
  <form class="send-form" [formGroup]="formulario" (ngSubmit)="confirmarEnvio()">
    <p class="test-summary">{{ resumen }}</p>

    <app-form-field label="ID solicitud" [required]="true">
      <input type="number" min="1" formControlName="solicitudId" placeholder="14" />
    </app-form-field>

    <app-form-field label="IDs de candidatos" [required]="true">
      <textarea formControlName="candidatoIds" placeholder="15, 18, 21"></textarea>
    </app-form-field>

    <app-form-field label="Fecha de vencimiento" [required]="true">
      <input type="datetime-local" formControlName="fechaVencimiento" />
    </app-form-field>

    <app-form-field label="Mensaje opcional">
      <textarea formControlName="mensaje" placeholder="Mensaje para acompanar el cuestionario"></textarea>
    </app-form-field>

    <p class="test-summary">
      El cuestionario queda asociado a esta solicitud. Para otra solicitud se debe crear un nuevo cuestionario usando preguntas del banco.
    </p>

    <footer class="modal-actions">
      <app-button variant="secondary" type="button" (pressed)="cerrar.emit()">Cancelar</app-button>
      <app-button type="submit" [disabled]="enviando">
        {{ enviando ? 'Enviando...' : 'Enviar cuestionario' }}
      </app-button>
    </footer>
  </form>
</app-modal>

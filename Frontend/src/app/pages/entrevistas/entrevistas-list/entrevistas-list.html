<app-page-layout>
  <app-page-header
    title="Listado de entrevistas"
    subtitle="Gestión de entrevistas"
  ></app-page-header>

  <app-alert-region [alerta]="alerta" (cerrar)="cerrarAlerta()"></app-alert-region>

  <app-filter-panel
    description="Usa uno o más campos para encontrar entrevistas."
    quickSearchPlaceholder="Buscar por solicitud, candidato o tipo"
    [(quickSearch)]="filtros.busquedaRapida"
    [collapsible]="true"
    [filtersExpanded]="false"
    (search)="buscar()"
    (clear)="limpiarFiltros()"
  >
    <label>
      Cargo vacante
      <input [(ngModel)]="filtros.cargo" type="text" placeholder="Ej. Frontend Angular" />
    </label>

    <label>
      Fecha agendada
      <app-date-picker [(ngModel)]="filtros.fecha"></app-date-picker>
    </label>

    <label>
      Estado entrevista
      <select [(ngModel)]="filtros.estado">
        <option value="">Todos</option>
        <option *ngFor="let estado of estados" [ngValue]="estado">{{ estado }}</option>
      </select>
    </label>

    <label>
      Tipo de entrevista
      <select [(ngModel)]="filtros.tipo">
        <option value="">Todos</option>
        <option *ngFor="let tipo of tipos" [ngValue]="tipo">{{ tipo }}</option>
      </select>
    </label>
  </app-filter-panel>

  <app-action-bar
    [message]="mensajeAccionesMasivas"
    *ngIf="!cargando && !errorCarga && entrevistasFiltradas.length > 0"
  >
    <button type="button" [disabled]="seleccionados.size === 0" (click)="abrirModalCorreo()">Correos masivos</button>
  </app-action-bar>

  <app-data-table
    title="Listado de entrevistas"
    [columns]="columnas"
    [rows]="entrevistasPaginadas"
    [total]="entrevistasFiltradas.length"
    [page]="paginaActual"
    [pageSize]="registrosPorPagina"
    [loading]="cargando"
    [errorMessage]="errorCarga"
    loadingMessage="Cargando entrevistas..."
    [rowId]="obtenerIdEntrevista"
    [actions]="acciones"
    [compactActions]="true"
    [selectedIds]="seleccionados"
    emptyTitle="No hay entrevistas para mostrar"
    emptyMessage="Ajusta los filtros o revisa la agenda de entrevistas."
    (selectedIdsChange)="seleccionados = $event"
    (pageChange)="cambiarPagina($event)"
    (pageSizeChange)="cambiarRegistrosPorPagina($event)"
    (actionClick)="manejarAccionTabla($event)"
    (clear)="limpiarFiltros()"
    (retry)="cargarEntrevistas()"
  ></app-data-table>

  <app-entrevista-form-modal
    *ngIf="mostrarFormulario"
    [candidatos]="candidatosAgendaMasiva"
    [errorApi]="errorFormularioAgenda"
    [guardando]="guardandoFormularioAgenda"
    (cerrar)="cerrarFormularioAgenda()"
    (guardar)="guardarEntrevista($event)"
  ></app-entrevista-form-modal>

  <app-modal
    *ngIf="mostrarModalCorreo"
    titulo="Correos masivos"
    [subtitulo]="seleccionados.size + ' entrevista(s) seleccionada(s)'"
    ancho="md"
    (cerrar)="cerrarModalCorreo()"
  >
    <section class="mail-modal">
      <p class="mail-note">
        Prepara el mensaje con plantilla. El envío de correos aún no está habilitado en esta pantalla.
      </p>

      <label>
        Plantilla
        <select [(ngModel)]="plantillaCorreo" (ngModelChange)="aplicarPlantillaCorreo()">
          <option value="recordatorio">Recordatorio de entrevista</option>
          <option value="reagendar">Reagendar entrevista</option>
          <option value="personalizada">Personalizada</option>
        </select>
      </label>

      <label>
        Destinatarios
        <textarea [ngModel]="correosPreview" readonly></textarea>
      </label>

      <label>
        Asunto
        <input type="text" [(ngModel)]="asuntoCorreo" />
      </label>

      <label>
        Mensaje
        <textarea [(ngModel)]="cuerpoCorreo"></textarea>
      </label>

      <p class="mail-note">
        Variables disponibles: {{ '{' }}{{ '{' }}Nombre{{ '}' }}{{ '}' }}, {{ '{' }}{{ '{' }}Solicitud{{ '}' }}{{ '}' }}, {{ '{' }}{{ '{' }}Cargo{{ '}' }}{{ '}' }}.
      </p>
    </section>

    <div class="mail-actions" modal-footer>
      <app-button variant="ghost" type="button" (pressed)="cerrarModalCorreo()">Cancelar</app-button>
      <app-button type="button" [disabled]="true">Enviar correos</app-button>
    </div>
  </app-modal>

  <app-entrevista-estado-modal
    *ngIf="entrevistaSeleccionada"
    [entrevista]="entrevistaSeleccionada"
    [detalle]="entrevistaDetalle"
    [modo]="modoEstado"
    [resultados]="resultadosEvaluacion"
    [guardando]="guardandoEstado"
    [guardandoEvaluaciones]="guardandoEvaluaciones"
    [cargandoDetalle]="cargandoDetalle"
    [error]="errorEstado"
    [errorEvaluaciones]="errorEvaluaciones"
    [mensajeEvaluaciones]="mensajeEvaluaciones"
    [usuarioActualId]="usuarioActualId"
    (cerrar)="cerrarModalEstado()"
    (confirmar)="confirmarEstado($event)"
    (guardarEvaluaciones)="guardarEvaluaciones($event)"
  ></app-entrevista-estado-modal>
</app-page-layout>

<app-page-layout>
  <app-page-header
    title="Listado de solicitudes"
    subtitle="Gestión de solicitudes"
  >
    <div pageHeaderActions>
      <app-button type="button" *ngIf="puedeCrearSolicitud" (pressed)="abrirFormulario()">
        <span aria-hidden="true">+</span>
        Crear nueva solicitud
      </app-button>
    </div>
  </app-page-header>

  <app-filter-panel
    description="Usa uno o más campos para encontrar solicitudes."
    quickSearchPlaceholder="Ej. SOL-000001, Banco BICE o Frontend"
    [(quickSearch)]="filtros.busquedaRapida"
    [collapsible]="true"
    [filtersExpanded]="false"
    (search)="buscar()"
    (clear)="limpiarFiltros()"
  >
    <app-alert-region
      *ngIf="alerta"
      [alerta]="alerta"
      (cerrar)="cerrarAlerta()"
    ></app-alert-region>

    <label>
      Solicitud
      <input [(ngModel)]="filtros.id" type="text" placeholder="Ej. SOL-000001" />
    </label>

    <label>
      Nombre de solicitud
      <input [(ngModel)]="filtros.nombre" type="text" placeholder="Ej. Frontend Latam" />
    </label>

    <label>
      Cliente
      <input [(ngModel)]="filtros.cliente" type="text" placeholder="Ej. Banco BICE" />
    </label>

    <label>
      Cargo solicitado
      <input [(ngModel)]="filtros.cargo" type="text" placeholder="Ej. Desarrollador Frontend" />
    </label>

    <label>
      Reclutador asignado
      <input [(ngModel)]="filtros.responsable" type="text" placeholder="Ej. Ana Perez" />
    </label>

    <label>
      Prioridad
      <select [(ngModel)]="filtros.prioridad">
        <option value="">Todas</option>
        <option>Alta</option>
        <option>Media</option>
        <option>Baja</option>
      </select>
    </label>

    <label>
      Estado
      <select [(ngModel)]="filtros.estado">
        <option value="">Todos</option>
        <option>Pendiente</option>
        <option>En publicación</option>
        <option>En Entrevistas</option>
        <option>Cancelado</option>
        <option>Cerrado</option>
        <option>Pausado</option>
      </select>
    </label>
  </app-filter-panel>

  <app-data-table
    title="Listado de solicitudes"
    [columns]="columnas"
    [rows]="solicitudesPaginadas"
    [total]="solicitudesFiltradas.length"
    [page]="paginaActual"
    [pageSize]="registrosPorPagina"
    [loading]="cargando"
    [errorMessage]="errorCarga"
    loadingMessage="Cargando solicitudes..."
    [rowId]="obtenerIdSolicitud"
    [actions]="acciones"
    [selectedIds]="seleccionados"
    emptyTitle="No hay solicitudes para mostrar"
    emptyMessage="Ajusta los filtros o limpia la búsqueda para volver al listado completo."
    (selectedIdsChange)="seleccionados = $event"
    (pageChange)="cambiarPagina($event)"
    (pageSizeChange)="cambiarRegistrosPorPagina($event)"
    (actionClick)="manejarAccionTabla($event)"
    (clear)="limpiarFiltros()"
    (retry)="cargarSolicitudes()"
  ></app-data-table>
</app-page-layout>

<app-solicitud-form-modal
  *ngIf="mostrarFormulario"
  [idSolicitud]="solicitudSeleccionadaId"
  [modo]="modoFormulario"
  [codigoSolicitudInicial]="solicitudSeleccionadaCodigo || ''"
  [codigoSolicitudSugerido]="modoFormulario === 'crear' ? codigoSolicitudEstimado : ''"
  [solicitudResumenInicial]="solicitudSeleccionadaResumen"
  (cerrar)="cerrarFormulario()"
  (guardado)="manejarFormularioGuardado()"
></app-solicitud-form-modal>

<app-confirm-dialog
  *ngIf="mostrarConfirmacionCancelacion"
  titulo="Cancelar solicitud"
  mensaje="Esta acción cambiará el estado de la solicitud a Cancelado."
  [detalle]="'Solicitud seleccionada: ' + (solicitudSeleccionadaCodigo || solicitudSeleccionadaId)"
  observacionLabel="Observación de cancelación *"
  observacionPlaceholder="Ej. Cancelada por solicitud del cliente"
  [observacionRequerida]="true"
  textoCancelar="Volver"
  textoConfirmar="Confirmar cancelación"
  variante="danger"
  (cancelar)="cerrarConfirmacionCancelacion()"
  (confirmar)="confirmarCancelacionSolicitud($event)"
></app-confirm-dialog>

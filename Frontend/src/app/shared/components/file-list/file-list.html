<section
  class="file-list"
  *ngIf="files.length > 0"
  [attr.aria-labelledby]="titleId"
  [attr.aria-describedby]="descriptionId"
>
  <!-- Resumen y tabla compacta de archivos seleccionados. -->
  <header>
    <div>
      <strong [id]="titleId">
        {{ files.length }} archivo{{ files.length === 1 ? '' : 's' }} listo{{ files.length === 1 ? '' : 's' }}
      </strong>
      <span [id]="descriptionId">{{ totalSizeMb | number: '1.1-1' }} MB en total</span>
    </div>
    <app-button variant="ghost" size="sm" (pressed)="clear.emit()">Limpiar</app-button>
  </header>

  <div class="file-table" tabindex="0" aria-label="Tabla de archivos seleccionados">
    <table>
      <thead>
        <tr>
          <th scope="col">Archivo</th>
          <th scope="col">Tamaño</th>
          <th scope="col" *ngIf="hasStatuses">Estado</th>
          <th scope="col">Acción</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let file of files; trackBy: trackFile">
          <td>
            <span>{{ file.name }}</span>
          </td>
          <td>{{ fileSizeMb(file) | number: '1.1-1' }} MB</td>
          <td *ngIf="hasStatuses">
            <div
              class="file-status"
              *ngIf="fileStatus(file) as status"
              [ngClass]="'is-' + status.state"
            >
              <strong>{{ status.label }}</strong>
              <span *ngIf="status.message">{{ status.message }}</span>
            </div>
          </td>
          <td>
            <app-icon-button
              icon="trash"
              [label]="'Quitar ' + file.name"
              (pressed)="remove.emit(file)"
            ></app-icon-button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</section>

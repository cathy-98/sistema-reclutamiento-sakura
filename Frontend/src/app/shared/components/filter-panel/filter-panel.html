<section class="filter-panel" [attr.aria-labelledby]="titleId">
  <!-- Panel reutilizable de búsqueda y filtros del módulo. -->
  <header class="filter-header">
    <div>
      <h3 [id]="titleId">{{ title }}</h3>
      <p *ngIf="description">{{ description }}</p>
    </div>

    <label class="quick-search" *ngIf="showQuickSearch">
      {{ quickSearchLabel }}
      <input
        [ngModel]="quickSearch"
        type="search"
        [placeholder]="quickSearchPlaceholder"
        (ngModelChange)="updateQuickSearch($event)"
      />
    </label>
  </header>

  <form class="panel-content" (ngSubmit)="search.emit()">
    <ng-content></ng-content>
  </form>

  <footer class="filter-actions">
    <app-button variant="ghost" (pressed)="clear.emit()">Limpiar filtros</app-button>
    <app-button (pressed)="search.emit()">Buscar</app-button>
  </footer>
</section>

<div class="modal-backdrop">
  <section
    class="app-modal"
    [ngClass]="ancho"
    role="dialog"
    aria-modal="true"
    [attr.aria-labelledby]="tituloId"
    [attr.aria-describedby]="subtitulo ? subtituloId : null"
  >
    <!-- Encabezado semántico de la ventana modal. -->
    <header class="modal-header">
      <div>
        <h2 [id]="tituloId">{{ titulo }}</h2>
        <p *ngIf="subtitulo" [id]="subtituloId">{{ subtitulo }}</p>
      </div>

      <div class="modal-header-extra">
        <ng-content select="[modal-header-extra]"></ng-content>
      </div>

      <button class="modal-close" type="button" aria-label="Cerrar" (click)="cerrar.emit()">
        ×
      </button>
    </header>

    <!-- Contenido proyectado por cada módulo que usa la modal. -->
    <div class="modal-body">
      <ng-content></ng-content>
    </div>

    <ng-content select="[modal-footer]"></ng-content>
  </section>
</div>

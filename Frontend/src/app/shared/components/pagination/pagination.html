<nav class="pagination-footer" aria-label="Paginación de tabla">
  <!-- Navegación y tamaño de página del listado actual. -->
  <span>Mostrando {{ visibleCount }} de {{ total }} registros</span>
  <div class="pagination">
    <label>
      Registros por página:
      <select [ngModel]="pageSize" aria-label="Registros por página" (ngModelChange)="changePageSize($event)">
        <option *ngFor="let option of pageSizeOptions" [ngValue]="option">{{ option }}</option>
      </select>
    </label>
    <button type="button" aria-label="Página anterior" [disabled]="page === 1" (click)="changePage(page - 1)">
      ‹
    </button>
    <ng-container *ngFor="let item of pageItems; trackBy: trackPageItem">
      <span *ngIf="item === 'ellipsis'" class="pagination-ellipsis" aria-hidden="true">...</span>
      <button
        *ngIf="item !== 'ellipsis'"
        type="button"
        [class.is-active]="item === page"
        [attr.aria-current]="item === page ? 'page' : null"
        [attr.aria-label]="'Ir a página ' + item"
        (click)="changePage(item)"
      >
        {{ item }}
      </button>
    </ng-container>
    <button
      type="button"
      aria-label="Página siguiente"
      [disabled]="page === totalPages"
      (click)="changePage(page + 1)"
    >
      ›
    </button>
  </div>
</nav>

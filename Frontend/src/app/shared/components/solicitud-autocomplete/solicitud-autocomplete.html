<div class="solicitud-autocomplete" (click)="$event.stopPropagation()">
  <input
    [id]="inputId"
    [name]="name || inputId"
    type="text"
    autocomplete="off"
    [required]="required"
    [disabled]="disabled"
    [ngModel]="value"
    [placeholder]="placeholder"
    (focus)="enfocar()"
    (ngModelChange)="actualizar($event)"
    (keydown)="manejarTecla($event)"
  />

  <div class="solicitud-autocomplete__list" *ngIf="mostrarOpciones" role="listbox">
    <button
      type="button"
      *ngFor="let solicitud of opciones; let index = index"
      role="option"
      [class.is-active]="index === opcionActiva"
      [class.is-selected]="estaSeleccionada(solicitud)"
      (mouseenter)="opcionActiva = index"
      (click)="seleccionar(solicitud)"
    >
      <strong>{{ solicitud.codigo }}</strong>
      <span>{{ solicitud.cargo || solicitud.nombre || 'Sin cargo' }}</span>
    </button>
  </div>

  <div class="solicitud-autocomplete__empty" *ngIf="mostrarSinResultados">
    {{ noResultsMessage }}
  </div>
</div>

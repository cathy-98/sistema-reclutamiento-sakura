<section
  class="state-message"
  [ngClass]="type"
  [attr.role]="type === 'error' ? 'alert' : 'status'"
  [attr.aria-live]="type === 'loading' ? 'polite' : null"
  [attr.aria-labelledby]="titleId"
  [attr.aria-describedby]="message ? messageId : null"
>
  <!-- Estado reutilizable para carga, error o ausencia de datos. -->
  <span class="loader" *ngIf="type === 'loading'" aria-hidden="true"></span>
  <strong [id]="titleId">{{ title }}</strong>
  <span *ngIf="message" [id]="messageId">{{ message }}</span>
  <app-button *ngIf="actionLabel" variant="ghost" size="sm" (pressed)="action.emit()">
    {{ actionLabel }}
  </app-button>
</section>


services:

  postgres_db:
    image: postgres:16
    container_name: elitsoft_postgres
    restart: always

    environment:
      POSTGRES_USER: elitsoft_admin
      POSTGRES_PASSWORD: elitsoft_password_2026
      POSTGRES_DB: db_reclutamiento_elitsoft

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./base_inicial.sql:/docker-entrypoint-initdb.d/base_inicial.sql

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U elitsoft_admin -d db_reclutamiento_elitsoft"
        ]
      interval: 5s
      timeout: 5s
      retries: 10


  backend:

    build:
      context: ./Backend
      dockerfile: Dockerfile

    container_name: elitsoft_backend

    restart: unless-stopped

    ports:
      - "8000:8000"

    # ------------------------------------------------------
    # VARIABLES DEL ARCHIVO .env DE LA RAÍZ
    # ------------------------------------------------------
    env_file:
      - .env

    environment:

      # La URL de PostgreSQL continúa siendo específica
      # del entorno Docker.
      DATABASE_URL: postgresql://elitsoft_admin:elitsoft_password_2026@postgres_db:5432/db_reclutamiento_elitsoft

      # Valores por defecto defensivos.
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-100}
      ACTIVE_USER_STATUS_NAME: ${ACTIVE_USER_STATUS_NAME:-Activo}
      DELETED_USER_STATUS_NAME: ${DELETED_USER_STATUS_NAME:-Eliminado}
      ADMIN_ROLE_NAME: ${ADMIN_ROLE_NAME:-Administrador}

    volumes:
      - ./Backend:/app

    depends_on:
      postgres_db:
        condition: service_healthy


  frontend:

    build:
      context: ./Frontend
      dockerfile: Dockerfile

    container_name: elitsoft_frontend

    restart: unless-stopped

    environment:
      # Frontend dentro de Docker debe resolver el backend por nombre de servicio.
      SAKURA_API_TARGET: http://backend:8000

    ports:
      - "4200:4200"

    volumes:
      - ./Frontend:/app
      - frontend_node_modules:/app/node_modules

    depends_on:
      - backend


volumes:

  postgres_data:
  frontend_node_modules:
